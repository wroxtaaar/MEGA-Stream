name: Deploy MEGA Stream to Oracle VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: mega-stream-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -eu
            if [ ! -d "$HOME/MEGA-Stream/.git" ]; then
              git clone https://github.com/wroxtaaar/MEGA-Stream.git "$HOME/MEGA-Stream"
            fi
            cd "$HOME/MEGA-Stream"
            git pull --ff-only origin main
            test -f .env || { echo "Missing $HOME/MEGA-Stream/.env; create it on the VPS before deploying."; exit 1; }
            docker compose up -d --build
            docker compose ps
            docker compose logs --tail 80 mega-stream
